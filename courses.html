<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./src/output.css">
</head>
<body>
    
<header class="header">
        <div class="container row justify-between max-md:w-7xl ">
            <div class="logo max-xs:font-medium xs:text-xl md:text-2xl">
                <a href="index.html">Coding Academy</a>
            </div>
            <div class="navbar">
                <nav class="hidden lg:row">
                    <ul class="row gap-8">
                        <li>
                            <a href="index.html" class="nav-link">Home</a>
                        </li>
                        <li>
                            <a href="courses.html" class="nav-link nav-link-active">Courses</a>
                        </li>
                        <li>
                            <a href="dashboard.html" class="nav-link">Dashboard</a>
                        </li>
                        <li>
                            <a href="profile.html" class="nav-link">Profile</a>
                        </li>
                    </ul>
                </nav>

            </div>
            <div class="buttons md:gap-7 row">
                <a href="login.html"
                    class="nav-link font-medium text-[#434655] py-2 px-4 hover:text-primary transition-all">Login</a>
                <a href="Register.html"
                    class="bg-primary py-2 px-6  rounded-lg text-[#FFFFFF] font-semibold">Register</a>
            </div>
        </div>
    </header>
    <main>
        <!-- start hero section -->
        <section class="hero courses">
            <div class="container mt-18.75 row justify-between max-md:max-md:flex-col">
                <div >
                    <span class="span pb-1">EXPLORE EXCELLENCE</span>
                    <h1>Our Courses</h1>
                    <p class="paragraph pt-[10.8px]">Master the latest technologies with our industry-led programs designed for <br>the modern engineer.</p>
                </div>
                <div class="max-md:container">
                    <form class="relative md:mt-17.5 xs:mt-3">
                        <label>
                    <img src="./images/CoursesPage-image/search.svg" class="absolute py-3 px-3" alt="search icon">
                        <input type="search" placeholder="Search for courses..." name="search" class="border border-[#C3C6D7] rounded-lg px-10 py-2"> 

                        </label>
                    </form>

                </div>
                
            </div>
            <div class="container border-t border-[#C3C6D74D] mt-8">
                <div class="mt-3">
             <button class="button-primary">All Courses</button>
             <button class="button-primary bg-[#E5EEFF] text-[#434655]">Web Development</button>
             <button class="button-primary bg-[#E5EEFF] text-[#434655]">Data Science</button>
             <button class="button-primary bg-[#E5EEFF] text-[#434655]">Mobile Apps</button>
             <button class="button-primary bg-[#E5EEFF] text-[#434655]">Cloud Architecture</button>
             <button class="button-primary bg-[#E5EEFF] text-[#434655]">Cybersecurity</button> 
                </div>
                </div>
        </section>
        <!-- end hero section -->

        <section class="bg-background mt-15">
            <div class="container">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 py-12.5">
 
                    <!-- Card 1 -->
                    <div class="bg-white rounded-xl shadow-sm border border-background flex flex-col justify-between w-full group">
                        <div>
                            <!-- Image -->
                            <div class="w-full rounded-t-lg  mb-4">
                                <img src="./images/CoursesPage-image/courses-section/React.webp" alt="Next.js Course"
                                    class="w-65.5 rounded-t-lg " />
                            </div>
                           
                                <div class="flex items-center justify-between mb-3">
                                    <span
                                        class="bg-background text-primary font-medium px-2.5 py-1 rounded">INTERMEDIATE</span>
                                    <p class="paragraph"><span><img src="./images/CoursesPage-image/courses-section/star.svg" alt=""></span> 42 Hours</p>

                                </div>

                                <div> 
                                <h3 class="font-bold mb-1">Advanced React & Next.js</h3>
                                <p class="paragraph mb-6">Master server components and optimization.</p>
                            </div>
                              
                            
                        </div>
                        <!-- Button -->
                        <div class="px-4 mb-4">
                       <button class="bg-[#0B1C30] row gap-2 text-[#FFFFFF] py-3 rounded-lg px-4">View Details<span>
                        <img src="./images/CoursesPage-image/courses-section/share-courses.svg" alt="share-courses icon">
                       </span></button>
                        </div>
                    </div>

                
                </div>
            </div>
           
        </section>
