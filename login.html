<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="src/output.css">
</head>

<body>
    <header class="header">
        <div class="container row justify-between max-md:w-7xl ">
            <div class="logo max-xs:font-medium xs:text-xl md:text-2xl">
                <a href="index.html">Coding Academy</a>
            </div>
            <div class="navbar">
                <nav class="hidden lg:row">
                    <ul class="row gap-8">
                        <li>
                            <a href="index.html" class="nav-link">Home</a>
                        </li>
                        <li>
                            <a href="courses.html" class="nav-link">Courses</a>
                        </li>
                        <li>
                            <a href="dashboard.html" class="nav-link">Dashboard</a>
                        </li>
                        <li>
                            <a href="profile.html" class="nav-link">Profile</a>
                        </li>
                    </ul>
                </nav>

            </div>
            <div class="buttons md:gap-7 row">
                <a href="login.html" class="nav-link font-medium text-primary py-2 px-4 hover:text-primary">Login</a>
                <a href="Register.html"
                    class="bg-primary py-2 px-6  rounded-lg text-[#FFFFFF] font-semibold">Register</a>
            </div>
        </div>
    </header>

    <!-- main -->

    <main>
        <section class="mt-16">
            <div class="big container mx-auto w-100 rounded-lg inset-shadow-2xs shadow bg-[#FFFFFF]">
                <div>
                    <div class="row gap-2 justify-center">
                        <div class="row gap-2 mt-16.25">
                            <img src="./images/LoginPage-image/login-icon.png" alt="login-icon" />
                            <h3 class="font-Inter font-bold">Coding Academy</h3>
                        </div>

                    </div>

                    <div class=" text-center mt-7.5 justify-center">
                        <h2 class="pb-0.75">Login to Academy</h2>
                        <p class="paragraph">Enter your credentials to access your <br /> courses.</p>
                    </div>

                    <!-- form -->


                    <form class="mt-8 justify-center row flex-col">


                        <div class="mt-7.5">
                            <label for="email" class="label">
                                EMAIL ADDRESS
                            </label>

                            <input id="email" type="text" name="email" placeholder="name@company.com"
                                class="border-[#C3C6D7] rounded-lg shadow py-2.5 px-4 mt-3 bg-background md:w-87.5" />

                        </div>

                        <div class="mt-10.5">
                            <label for="PASSWORD" class="label row justify-between">
                                PASSWORD

                                <a href="#" class="text-primary">Forgot Password?</a>
                            </label>

                            <div class="pt-2">
                                <input id="PASSWORD" type="text" name="PASSWORD" placeholder="••••••••"
                                    class="border-[#C3C6D7] rounded-lg shadow py-2.5  px-4 bg-background md:w-87.5" />
                            </div>

                        </div>




                </div>
                </form>

                <div class="flex gap-3 mt-6">
                    <input type="checkbox" id="Remember Me" name="Remember Me" class="w-5 h-5">

                    <label for="Remember Me">
                        <p class="paragraph">Remember Me</p>
                    </label>
                </div>

                <!-- Button -->
                <div class=" row justify-center text-center mt-6">
                    <button type="submit" class="bg-primary row py-4 px-15 rounded-lg gap-3 hover:bg-primary/90">
                        <p class="font-Inter font-semibold text-[24px] leading-[33.6px] text-[#FFFFFF]">Sign Up</p>
                        <img src="./images/LoginPage-image/button-imageLogin.svg" class="w-4"
                            alt="button-imageLogin icon" />
                    </button>
                </div>

                <!-- ==== -->
                <div class="my-8 row gap-4">
                    <div class="h-px flex-1 bg-gray-300"></div>

                    <p class="paragraph">
                        OR CONTINUE WITH
                    </p>

                    <div class="h-px flex-1 bg-gray-300"></div>
                </div>

                <!-- button -->
                <div class="row justify-center gap-3 my-8">
                    <div
                        class="border border-[#C3C6D7] row w-42.25 gap-2 py-3 px-3 rounded-lg justify-center hover:bg-background transition-all">
                        <img src="./images/register-page/Google.webp" class="w-5" alt="Google icon" />
                        <button class="font-Inter font-semibold leading-[25.6px]">Google</button>
                    </div>
                    <div
                        class="border border-[#C3C6D7] row w-42.25 gap-2 py-3 px-3 rounded-lg justify-center hover:bg-background transition-all">
                        <img src="./images/register-page/GitHub.webp" class="w-5" alt="GitHub icon" />
                        <button class="font-Inter font-semibold leading-[25.6px]">GitHub</button>
                    </div>

                </div>

                <div class="text-center pb-16">
                    <p class="paragraph">
                        Don't have an account?<a href="#" class="text-primary hover:underline transition-all">Sign
                            Up</a>
                    </p>
                </div>


            </div>


        </section>
    </main>

    <!-- footer -->
    <footer>
        <section class="bg-background mt-16 border-t border-[#C3C6D74D]">
            <div class="py-8 row justify-between container">
            
                <p class="paragraph text-[#434655B2]">© 2024 Coding Academy. All rights reserved.</p>
                <div class="row gap-5.75">
                    <p class="paragraph">Privacy Policy</p>
                    <p class="paragraph">Terms of Service</p>
                </div>
            </div>


        </section>
    </footer>

</body>

</html>
