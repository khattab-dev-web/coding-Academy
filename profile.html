<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./src/output.css">
</head>

<body>

    <header class="header">
        <div class="container row justify-between max-md:w-7xl ">
            <div class="logo max-xs:font-medium xs:text-xl md:text-2xl">
                <a href="index.html">Coding Academy</a>
            </div>
            <div class="navbar">
                <nav class="hidden lg:row">
                    <ul class="row gap-8">
                        <li>
                            <a href="index.html" class="nav-link">Home</a>
                        </li>
                        <li>
                            <a href="courses.html" class="nav-link">Courses</a>
                        </li>
                        <li>
                            <a href="dashboard.html" class="nav-link">Dashboard</a>
                        </li>
                        <li>
                            <a href="profile.html" class="nav-link nav-link-active">Profile</a>
                        </li>
                    </ul>
                </nav>

            </div>
            <div class="buttons md:gap-7 row">
                <a href="login.html"
                    class="nav-link font-medium text-[#434655] py-2 px-4 hover:text-primary transition-all">Login</a>
                <a href="Register.html"
                    class="bg-primary py-2 px-6  rounded-lg text-[#FFFFFF] font-semibold">Register</a>
            </div>
        </div>
    </header>

    <!-- main -->
    
      <main class="px-4">
  <div class="big border border-[#C3C6D7] shadow rounded-lg w-full max-w-130 mx-auto my-6 sm:my-11">
    <div class="py-6 sm:py-8">

      <!-- Profile Header -->
      <div class="flex flex-col items-center justify-center gap-1 text-center">
        <img src="./images/profile-page/profile-image.webp" alt="profile image" class="w-20 h-20 object-cover" />
        <h2 class="text-[#0B1C30] text-xl font-semibold mt-2">Alex Johnson</h2>
        <span class="bg-background text-primary py-1 px-3 rounded-lg text-sm">Student</span>
      </div>

      <!-- Border Divider -->
      <div class="h-px bg-[#C3C6D7] mx-4 sm:mx-6 my-6"></div>

      <!-- Paragraph -->
      <div class="px-4 sm:px-8">
        <p class="w-full text-center text-sm sm:text-base text-gray-600">
          Passionate learner focused on mastering full-stack development and cloud architecture. Currently exploring React ecosystems and serverless technologies.
        </p>
      </div>

      <!-- Form -->
      <div class="px-4 sm:px-8 mt-8">
        <form action="">
          
          <!-- Input 1: Email -->
          <div class="relative flex items-center bg-background border border-[#C3C6D7] rounded-lg shadow px-4 py-2 w-full">
            <img src="./images/profile-page/Email-icon.webp" class="w-5 h-5 mr-3 flex-shrink-0" alt="Email-icon" />
            <div class="flex flex-col w-full">
              <label for="email" class="text-[#737686] mb-1 text-xs">
                Email Address
              </label>
              <input id="email" type="email" name="email" placeholder="alex.johnson@example.com"
                class="placeholder-black w-full bg-background text-sm text-gray-800 font-medium focus:outline-none" />
            </div>
          </div>

          <!-- Input 2: Phone -->
          <div class="relative flex items-center bg-background border border-[#C3C6D7] rounded-lg shadow px-4 py-2 mt-3 w-full">
            <img src="./images/profile-page/phone-icon.webp" class="w-5 h-5 mr-3" alt="phone-icon" />
            <div class="flex flex-col w-full">
              <label for="phone" class="text-[#737686] mb-1 text-xs">
                Phone Number
              </label>
              <input id="phone" type="tel" name="phone" placeholder="+1 (555) 000-0000"
                class="placeholder-black w-full bg-background text-sm text-gray-800 font-medium focus:outline-none" />
            </div>
          </div>

          <!-- Button -->
          <div class="mt-8">
            <button type="submit" class="bg-primary text-[#FFFFFF] py-3 sm:py-4 w-full hover:bg-primary/80 rounded-lg transition-colors font-medium">
              Edit Profile
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</main>


</body>

</html>
